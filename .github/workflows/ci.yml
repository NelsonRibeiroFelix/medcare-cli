name: CI MedCare-CLI

on:
  push:
      branches: [ main ]
        pull_request:
            branches: [ main ]

            jobs:
              build:
                  runs-on: ubuntu-latest

                      steps:
                          - uses: actions/checkout@v3
                              - name: Set up Python
                                    uses: actions/setup-python@v4
                                          with:
                                                  python-version: '3.11'
                                                      - name: Install dependencies
                                                            run: |
                                                                    python -m pip install --upgrade pip
                                                                            pip install .[dev] requests pytest-mock
                                                                                - name: Run tests
                                                                                      run: |
                                                                                              pytest
                                                                                                  - name: Run linting
                                                                                                        run: |
                                                                                                                ruff check src/ tests/
                                                                                                                
                                                                                                                
