[project]
name = "medcare-cli"
version = "1.0.0"
description = "Ferramenta CLI para controle de medicamentos, desenvolvida para o BootCamp de ADS."
authors = [
    { name = "Nelson Ribeiro Felix", email = "nelson.felix@exemplo.com" }
]
dependencies = [
    "tabulate>=0.9.0",
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
